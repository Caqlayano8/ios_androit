name: iOS MergeBridge

on:
  push:
    paths:
      - "ios/MergeBridge/**"
      - ".github/workflows/ios-mergebridge.yml"
  pull_request:
    paths:
      - "ios/MergeBridge/**"
      - ".github/workflows/ios-mergebridge.yml"
  workflow_dispatch:

jobs:
  simulator-build:
    name: Build iOS app on simulator
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build MergeBridge
        working-directory: ios/MergeBridge
        run: |
          xcodebuild \
            -project MergeBridge.xcodeproj \
            -scheme MergeBridge \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

  signed-archive:
    name: Signed archive for iPhone
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.IOS_CERTIFICATE_BASE64 }}"
          test -n "${{ secrets.IOS_CERTIFICATE_PASSWORD }}"
          test -n "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}"
          test -n "${{ secrets.IOS_KEYCHAIN_PASSWORD }}"
          test -n "${{ secrets.IOS_TEAM_ID }}"
          test -n "${{ secrets.IOS_BUNDLE_ID }}"
          test -n "${{ secrets.IOS_EXPORT_METHOD }}"

      - name: Install signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"

      - name: Archive MergeBridge
        working-directory: ios/MergeBridge
        run: |
          xcodebuild \
            -project MergeBridge.xcodeproj \
            -scheme MergeBridge \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/MergeBridge.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ secrets.IOS_BUNDLE_ID }}" \
            archive

      - name: Export IPA
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ secrets.IOS_EXPORT_METHOD }}</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ secrets.IOS_BUNDLE_ID }}</key>
              <string>$PP_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MergeBridge.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MergeBridge-xcarchive
          path: ${{ runner.temp }}/MergeBridge.xcarchive

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MergeBridge-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
